<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="fantasy-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2e1065" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2e1065" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="sky-grad-fantasy-world-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="60%" stop-color="#581C87"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
  </defs>

  <!-- Sky Layer: Floating Crystal Isle diorama backdrop -->
  <rect width="1600" height="900" fill="#581C87"/>
  <rect width="1600" height="500" fill="url(#sky-grad-fantasy-world-4)" opacity="0.9"/>

  <!-- Floating Crystal Peaks & Sparkles -->
  <g opacity="0.7">
    <polygon points="220,440 340,220 460,440" fill="#C084FC"/>
    <polygon points="1160,430 1300,200 1440,430" fill="#E879F9"/>
    <circle cx="300" cy="160" r="3" fill="#FDE047"/>
    <circle cx="620" cy="220" r="2.5" fill="#67E8F9"/>
    <circle cx="940" cy="150" r="3" fill="#FDE047"/>
    <circle cx="1250" cy="210" r="2.5" fill="#67E8F9"/>
  </g>
  <!-- Bioluminescent Giant Mushroom Cutouts -->
  <g filter="url(#fantasy-shadow)">
    <path d="M 160 480 Q 300 280 440 480 Z" fill="#9333EA" stroke="#C084FC" stroke-width="2"/>
    <rect x="280" y="480" width="40" height="200" fill="#581C87"/>
    <circle cx="230" cy="400" r="14" fill="#FDE047"/>
    <circle cx="360" cy="380" r="12" fill="#FDE047"/>
    <path d="M 1120 460 Q 1280 260 1440 460 Z" fill="#7E22CE" stroke="#E879F9" stroke-width="2"/>
    <rect x="1260" y="460" width="40" height="220" fill="#3B0764"/>
    <circle cx="1220" cy="380" r="14" fill="#67E8F9"/>
    <circle cx="1340" cy="360" r="12" fill="#67E8F9"/>
  </g>
  <!-- Enchanted Moss Floor & Glowing River Path -->
  <g filter="url(#fantasy-shadow)">
    <path d="M 0 620 Q 420 560 880 600 T 1600 580 L 1600 900 L 0 900 Z" fill="#064E3B"/>
    <path d="M 0 760 Q 450 680 900 740 T 1600 710 L 1600 840 Q 900 820 450 850 T 0 900 Z" fill="#0D9488" stroke="#5EEAD4" stroke-width="2"/>
  </g>
</svg>
