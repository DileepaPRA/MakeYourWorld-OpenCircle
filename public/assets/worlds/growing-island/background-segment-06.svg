<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="island-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#082f49" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#082f49" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="sky-grad-growing-island-6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
  </defs>

  <!-- Sky Layer: Hidden Sea Cove diorama backdrop -->
  <rect width="1600" height="900" fill="#BAE6FD"/>
  <rect width="1600" height="500" fill="url(#sky-grad-growing-island-6)" opacity="0.9"/>

  <!-- Distant Volcanic Island Peak -->
  <g filter="url(#island-shadow)">
    <polygon points="500,520 800,280 1150,520" fill="#0F766E" opacity="0.65"/>
    <polygon points="850,520 1100,320 1350,520" fill="#115E59" opacity="0.55"/>
  </g>
  <!-- Ocean Horizon & Crest Waves -->
  <g filter="url(#island-shadow)">
    <path d="M 0 520 L 1600 520 L 1600 680 Q 1100 640 600 670 T 0 680 Z" fill="#0284C7"/>
    <path d="M 0 670 Q 400 640 800 660 T 1600 650" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.8"/>
  </g>
  <!-- Sandy Shoreline Beach -->
  <g filter="url(#island-shadow)">
    <path d="M 0 680 Q 450 630 950 670 T 1600 650 L 1600 900 L 0 900 Z" fill="#FDE68A"/>
    <path d="M 0 750 Q 520 700 1050 730 T 1600 710 L 1600 900 L 0 900 Z" fill="#FCD34D"/>
  </g>
</svg>
