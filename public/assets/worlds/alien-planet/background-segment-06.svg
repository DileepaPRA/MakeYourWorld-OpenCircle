<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="alien-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#022c22" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#022c22" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="sky-grad-alien-planet-6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180828"/>
      <stop offset="60%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
  </defs>

  <!-- Sky Layer: Bioluminescent Marsh diorama backdrop -->
  <rect width="1600" height="900" fill="#0F766E"/>
  <rect width="1600" height="500" fill="url(#sky-grad-alien-planet-6)" opacity="0.9"/>

  <!-- Alien Dual Moons -->
  <g filter="url(#alien-shadow)">
    <circle cx="1250" cy="180" r="65" fill="#BEF264" stroke="#84CC16" stroke-width="2" opacity="0.85"/>
    <ellipse cx="1230" cy="165" rx="14" ry="7" fill="#65A30D" opacity="0.6"/>
    <circle cx="340" cy="220" r="35" fill="#67E8F9" stroke="#06B6D4" stroke-width="1.5" opacity="0.7"/>
  </g>
  <!-- Xenolith Spire Ridges -->
  <g filter="url(#alien-shadow)">
    <polygon points="120,480 320,240 520,480" fill="#134E4A" opacity="0.7"/>
    <polygon points="460,480 720,220 980,480" fill="#042F2E" opacity="0.8"/>
    <polygon points="920,480 1180,260 1440,480" fill="#134E4A" opacity="0.7"/>
  </g>
  <!-- Bioluminescent Crater Basin & Xenolith Floor -->
  <g filter="url(#alien-shadow)">
    <path d="M 0 540 Q 450 480 920 520 T 1600 500 L 1600 750 L 0 750 Z" fill="#065F46"/>
    <path d="M 0 650 Q 520 590 1050 630 T 1600 610 L 1600 850 Q 1100 830 550 860 T 0 880 Z" fill="#0D9488" stroke="#2DD4BF" stroke-width="2"/>
    <path d="M 0 780 Q 420 730 880 760 T 1600 740 L 1600 900 L 0 900 Z" fill="#022C22"/>
  </g>
</svg>
