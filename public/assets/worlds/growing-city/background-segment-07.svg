<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="city-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="sky-grad-growing-city-7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Sky Layer: Old Brick Warehouse diorama backdrop -->
  <rect width="1600" height="900" fill="#94A3B8"/>
  <rect width="1600" height="500" fill="url(#sky-grad-growing-city-7)" opacity="0.9"/>

  <!-- Midground Skyline Buildings -->
  <g filter="url(#city-shadow)">
    <rect x="80" y="320" width="260" height="380" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
    <rect x="120" y="360" width="40" height="50" rx="2" fill="#FEF08A"/>
    <rect x="200" y="360" width="40" height="50" rx="2" fill="#FEF08A"/>
    <rect x="420" y="240" width="300" height="460" fill="#334155" stroke="#1E293B" stroke-width="2"/>
    <polygon points="570,160 550,240 590,240" fill="#475569"/>
    <rect x="460" y="280" width="45" height="60" rx="2" fill="#FEF08A"/>
    <rect x="550" y="280" width="45" height="60" rx="2" fill="#FEF08A"/>
    <rect x="640" y="280" width="45" height="60" rx="2" fill="#FEF08A"/>
    <rect x="840" y="290" width="340" height="410" fill="#78350F" stroke="#451A03" stroke-width="2"/>
    <rect x="890" y="340" width="50" height="70" rx="2" fill="#FEF08A"/>
    <rect x="990" y="340" width="50" height="70" rx="2" fill="#FEF08A"/>
    <rect x="1090" y="340" width="50" height="70" rx="2" fill="#FEF08A"/>
    <rect x="1260" y="260" width="260" height="440" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
    <rect x="1310" y="320" width="45" height="60" rx="2" fill="#FEF08A"/>
    <rect x="1410" y="320" width="45" height="60" rx="2" fill="#FEF08A"/>
  </g>
  <!-- Paved Sidewalk & Roadway -->
  <g filter="url(#city-shadow)">
    <rect x="0" y="700" width="1600" height="60" fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="0" y="760" width="1600" height="140" fill="#1E293B"/>
    <line x1="0" y1="830" x2="1600" y2="830" stroke="#FEF08A" stroke-width="4" stroke-dasharray="35,25"/>
  </g>
</svg>
