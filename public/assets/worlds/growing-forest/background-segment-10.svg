<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="paper-shadow-soft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#050d12" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#050d12" flood-opacity="0.20"/>
    </filter>
    <linearGradient id="sky-grad-10" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2E3D"/>
      <stop offset="50%" stop-color="#2B4553"/>
      <stop offset="85%" stop-color="#43625A"/>
      <stop offset="100%" stop-color="#6B7F6D"/>
    </linearGradient>
  </defs>

  <!-- Sky Layer: Dusky twilight evening diorama -->
  <rect width="1600" height="900" fill="#2B4553"/>
  <rect width="1600" height="520" fill="url(#sky-grad-10)"/>

  <!-- Glowing Dusk Horizon Crescent Moon Cutout -->
  <g filter="url(#paper-shadow-soft)">
    <circle cx="1300" cy="180" r="45" fill="#FEF3C7"/>
    <circle cx="1316" cy="172" r="42" fill="#223746"/>
  </g>

  <!-- Early Twilight Stars (Handcrafted Paper Pinpricks) -->
  <g opacity="0.75">
    <circle cx="180" cy="120" r="2" fill="#FEF08A"/>
    <circle cx="340" cy="80" r="1.5" fill="#FFFFFF"/>
    <circle cx="520" cy="140" r="2" fill="#FFFFFF"/>
    <circle cx="780" cy="90" r="2.5" fill="#FEF08A"/>
    <circle cx="980" cy="130" r="1.5" fill="#FFFFFF"/>
    <circle cx="1150" cy="70" r="2" fill="#FEF08A"/>
    <circle cx="1450" cy="110" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Distant Dusky Mountain Silhouettes -->
  <g filter="url(#paper-shadow-soft)">
    <polygon points="0,480 200,320 440,460 700,290 960,450 1240,280 1480,420 1600,340 1600,600 0,600" fill="#2C4846" opacity="0.9"/>
  </g>

  <!-- Deep Dusk Ridge Silhouette -->
  <g filter="url(#paper-shadow-soft)">
    <path d="M 0,530 Q 320,470 660,510 T 1300,480 T 1600,520 L 1600,750 L 0,750 Z" fill="#213E38"/>
    <!-- Lookout Silhouettes -->
    <polygon points="160,490 175,445 190,490" fill="#152B26"/>
    <polygon points="520,505 535,460 550,505" fill="#152B26"/>
    <polygon points="860,485 875,435 890,485" fill="#152B26"/>
    <polygon points="1200,480 1215,435 1230,480" fill="#152B26"/>
  </g>

  <!-- Lookout Cliff Edge Tier -->
  <g filter="url(#paper-shadow-soft)">
    <path d="M 0,620 Q 420,570 880,610 T 1600,580 L 1600,900 L 0,900 Z" fill="#19332C"/>
    <!-- Wooden lookout fence silhouette on cliff -->
    <rect x="220" y="585" width="8" height="30" fill="#0E1E19"/>
    <rect x="260" y="583" width="8" height="30" fill="#0E1E19"/>
    <rect x="300" y="582" width="8" height="30" fill="#0E1E19"/>
    <rect x="340" y="583" width="8" height="30" fill="#0E1E19"/>
    <rect x="215" y="592" width="135" height="5" fill="#0E1E19"/>
    <rect x="215" y="602" width="135" height="5" fill="#0E1E19"/>
  </g>

  <!-- Deep Shadow Valley Terrace -->
  <g filter="url(#paper-shadow-soft)">
    <path d="M 0,710 Q 360,670 780,710 T 1600,680 L 1600,900 L 0,900 Z" fill="#122721"/>
  </g>

  <!-- Foreground Twilight Rim (Deepest Forest Green) -->
  <g filter="url(#paper-shadow-soft)">
    <path d="M 0,790 Q 500,750 1020,790 T 1600,760 L 1600,900 L 0,900 Z" fill="#0B1B15"/>
  </g>
</svg>
