<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <filter id="paper-shadow-soft" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0a140f" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0a140f" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="sky-grad-5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B9D4C7"/>
      <stop offset="60%" stop-color="#DDEAE2"/>
      <stop offset="100%" stop-color="#EEF5F0"/>
    </linearGradient>
  </defs>

  <!-- Sky Layer: Elevated misty atmosphere -->
  <rect width="1600" height="900" fill="#DDEAE2"/>
  <rect width="1600" height="500" fill="url(#sky-grad-5)" opacity="0.95"/>

  <!-- High Mountain Paper Silhouettes in Mist -->
  <g filter="url(#paper-shadow-soft)" opacity="0.75">
    <polygon points="0,480 180,280 420,440 680,250 940,430 1220,270 1480,410 1600,320 1600,600 0,600" fill="#789A8B"/>
  </g>

  <!-- Rolling Mist Bands (Paper ribbons of fog) -->
  <g opacity="0.5" filter="url(#paper-shadow-soft)">
    <path d="M -50,420 Q 300,380 650,410 T 1350,390 T 1650,420 L 1650,470 Q 1300,440 700,460 T -50,460 Z" fill="#FFFFFF"/>
    <path d="M -50,470 Q 400,430 850,460 T 1650,440 L 1650,510 Q 1100,480 500,500 T -50,510 Z" fill="#F4F8F5"/>
  </g>

  <!-- Misty Intermediate Ridge -->
  <g filter="url(#paper-shadow-soft)">
    <path d="M 0,510 Q 340,450 720,490 T 1400,460 T 1600,500 L 1600,750 L 0,750 Z" fill="#436B57"/>
    <polygon points="120,475 135,430 150,475" fill="#2E4F3E"/>
    <polygon points="420,465 435,420 450,465" fill="#2E4F3E"/>
    <polygon points="760,485 775,435 790,485" fill="#2E4F3E"/>
    <polygon points="1120,460 1135,410 1150,460" fill="#2E4F3E"/>
    <polygon points="1440,480 1455,430 1470,480" fill="#2E4F3E"/>
  </g>

  <!-- High Elevation Ridge Cutout -->
  <g filter="url(#paper-shadow-soft)">
    <path d="M 0,610 Q 480,540 920,590 T 1600,560 L 1600,900 L 0,900 Z" fill="#2F523F"/>
    <polygon points="260,570 280,510 300,570" fill="#1F3A2C"/>
    <polygon points="640,560 660,500 680,560" fill="#1F3A2C"/>
    <polygon points="1020,570 1040,510 1060,570" fill="#1F3A2C"/>
    <polygon points="1380,550 1400,490 1420,550" fill="#1F3A2C"/>
  </g>

  <!-- Rocky Crest Shelf Tier -->
  <g filter="url(#paper-shadow-soft)">
    <path d="M 0,710 Q 380,650 780,690 T 1600,670 L 1600,900 L 0,900 Z" fill="#234333"/>
  </g>

  <!-- Foreground Mountain Slope (Deep Evergreen) -->
  <g filter="url(#paper-shadow-soft)">
    <path d="M 0,790 Q 520,740 1050,780 T 1600,750 L 1600,900 L 0,900 Z" fill="#152E20"/>
  </g>
</svg>
